name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run pytest

      - name: Run type checks
        run: uv run mypy app

      - name: Smoke check Flask routes
        run: uv run flask --app run routes
