name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run pytest

      - name: Run type checks
        run: uv run mypy app

      - name: Smoke check Flask routes
        run: uv run flask --app run routes

      - name: Build Docker image
        run: docker build -t products-api-assignment:ci .

      - name: Scan Docker image with Trivy
        run: |
          # Fail on actionable high/critical vulnerabilities, but do not block on unfixed OS CVEs.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --format table \
            --ignore-unfixed \
            --skip-version-check \
            --exit-code 1 \
            products-api-assignment:ci

      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 --name products-api-assignment products-api-assignment:ci
          sleep 5
          curl -f http://localhost:8000 || exit 1

      - name: Stop Docker container
        if: always()
        run: docker rm -f products-api-assignment || true
