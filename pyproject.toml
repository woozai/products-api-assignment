[project]
name = "products-api-assignment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "types-requests>=2.33.0.20260408",
]

[tool.mypy]
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true
